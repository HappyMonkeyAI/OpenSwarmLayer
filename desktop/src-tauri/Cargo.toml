[package]
name = "ts-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde.workspace = true
serde_cbor.workspace = true
sha2 = "0.10"
ts-core = { path = "../../crates/ts-core" }
ts-daemon = { path = "../../crates/ts-daemon" }
ts-format = { path = "../../crates/ts-format" }
ts-store = { path = "../../crates/ts-store" }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
